name: CI

on:
  push:
    branches: ['**']
  pull_request:

# A new push to the same branch makes the previous run's result irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: Server — unit & integration tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json

      # node-pty and better-sqlite3 are native modules; `npm ci` builds them
      # from source when no prebuilt binary matches the runner.
      - run: npm ci

      - run: npm test

  client:
    name: Client — lint & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json

      - run: npm ci

      # Warnings are reported but do not fail the build; the two that remain
      # are mount-once effects whose dependency arrays are deliberate.
      - run: npm run lint

      - run: npm run build

  e2e:
    name: End-to-end — two-browser convergence
    runs-on: ubuntu-latest
    # The slowest job, and it only makes sense once both halves compile.
    needs: [server, client]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            client/package-lock.json
            server/package-lock.json

      - name: Install dependencies
        run: |
          npm ci --prefix server
          npm ci --prefix client

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: client

      # Playwright starts both the API and the Vite dev server itself, so there
      # is nothing to orchestrate here.
      - name: Run end-to-end tests
        run: npm run test:e2e
        working-directory: client

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: client/playwright-report/
          retention-days: 7
