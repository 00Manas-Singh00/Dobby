name: CI

on:
  push:
    branches: ['**']
  pull_request:

# A new push to the same branch makes the previous run's result irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: Server — unit & integration tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    # The cluster suite needs a real Redis. Faking it would be self-defeating:
    # the failures it guards against live in the adapter's wire format, in
    # SET NX PX semantics, and in whether fetchSockets really crosses replicas.
    # Without REDIS_URL that file skips itself, so this service is what makes the
    # difference between the suite running and the suite pretending.
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      # Likewise for Postgres: the suite runs twice, once per engine. A stub
      # would verify the SQL this project writes against nothing.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: dobby
          POSTGRES_PASSWORD: dobby
          POSTGRES_DB: dobby_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dobby"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json

      # node-pty and better-sqlite3 are native modules; `npm ci` builds them
      # from source when no prebuilt binary matches the runner.
      - run: npm ci

      # SQLite: the default store, and what a contributor gets with no services
      # running at all.
      - run: npm test
        env:
          REDIS_URL: redis://127.0.0.1:6379

      # And again on Postgres. The store is behind one interface with two
      # drivers, and the whole point of Phase 5 is the second one — so running
      # the suite only on SQLite would leave every Postgres-specific spelling
      # (`$n` placeholders, bigint counts, bytea, `lower()` in place of COLLATE
      # NOCASE) verified by inspection rather than by a test. Same suite, same
      # assertions, other engine.
      - name: Run the suite again against Postgres
        run: npm test
        env:
          REDIS_URL: redis://127.0.0.1:6379
          DATABASE_URL: postgres://dobby:dobby@127.0.0.1:5432/dobby_test

  client:
    name: Client — lint & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json

      - run: npm ci

      # Warnings are reported but do not fail the build; the two that remain
      # are mount-once effects whose dependency arrays are deliberate.
      - run: npm run lint

      - run: npm run build

  e2e:
    name: End-to-end — two-browser convergence & workspace
    runs-on: ubuntu-latest
    # The slowest job, and it only makes sense once both halves compile.
    needs: [server, client]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            client/package-lock.json
            server/package-lock.json

      - name: Install dependencies
        run: |
          npm ci --prefix server
          npm ci --prefix client

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: client

      # Playwright starts both the API and a production preview build itself,
      # so there is nothing to orchestrate here. This runs every spec in
      # client/e2e — editor convergence, the file tree, the whiteboard, and
      # document history.
      - name: Run end-to-end tests
        run: npm run test:e2e
        working-directory: client

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: client/playwright-report/
          retention-days: 7
