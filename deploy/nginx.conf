# deploy/nginx.conf
#
# Reference load-balancer configuration for a multi-replica Dobby.
#
# Dobby is not uniformly stateless, and the whole of this file is about the two
# places where it is not.
#
#   1. **A Socket.IO connection must keep reaching the same replica.** Not for
#      the usual session-affinity reason — the handshake is a JWT and any node
#      can verify it — but because the HTTP long-polling transport makes several
#      requests that belong to one connection, and because a terminal session is
#      a live PTY in one process and cannot be reattached from another.
#
#   2. **A Yjs document must reach the *one* replica that owns it.** A `Y.Doc`
#      is state, not a message; two replicas serving the same document each keep
#      their own copy and each persist it, so the last writer wins whatever the
#      other person typed. The Redis adapter does not fix this, because the
#      problem is not delivery. See `server/services/documentRouter.js`.
#
# Everything else — the REST API, `/health` — is genuinely stateless and is
# balanced normally.
#
# If the hashing below is wrong or missing, Dobby does not corrupt documents: a
# replica that does not hold the lease refuses the connection with
# `DOCUMENT_MOVED` and the client retries. Watch
# `dobby_document_lease_conflicts_total`; in a correct deployment it stays at
# zero, and any sustained increase means this file and reality have diverged.

upstream dobby_api {
    # Ordinary balancing. Any node can serve any REST call.
    least_conn;
    server dobby-1:5001 max_fails=3 fail_timeout=10s;
    server dobby-2:5001 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

upstream dobby_sockets {
    # Sticky by client for the main namespace: one connection, one replica, for
    # the reasons in (1) above.
    #
    # The key is `$affinity_key` — the client's own id, falling back to its
    # address — rather than `ip_hash`. `ip_hash` is the portable choice and it
    # is wrong wherever many users share an address: behind a CDN, a corporate
    # NAT, or a mobile carrier it pins all of them to one replica, and it
    # unpins any of them the moment their address changes. Hashing on a value
    # the browser keeps is stable across both. It is a routing key and not a
    # credential — the server authenticates the JWT in the handshake and never
    # reads this — so forging it moves the forger to another replica and
    # nothing else.
    hash $affinity_key consistent;
    server dobby-1:5001;
    server dobby-2:5001;
}

upstream dobby_documents {
    # Sticky by *document*, for the reasons in (2) above. `consistent` matters:
    # with plain modulo hashing, adding a third replica reshuffles nearly every
    # document at once and every open editor reconnects in the same second.
    # Consistent hashing moves only the documents that must move.
    #
    # `$arg_doc` is the `?doc=<roomId>:<fileId>` the client appends — see
    # `client/src/services/yjsProvider.js`. It is a hint for this hash and
    # nothing else: the server authorizes and takes its lease on the namespace
    # the client actually connected to, so a forged value misroutes the liar and
    # grants them nothing.
    hash $arg_doc consistent;
    server dobby-1:5001;
    server dobby-2:5001;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# `?client=<id>` is set by every Socket.IO connection the app opens (see
# client/src/services/clientId.js). The address is the fallback for anything
# that does not send one — an old client, or a probe — which is no worse than
# the `ip_hash` this replaced.
map $arg_client $affinity_key {
    default   $arg_client;
    ''        $remote_addr;
}

server {
    listen 80;
    server_name _;

    # WebSocket frames carry Yjs updates, which are small and frequent. Buffering
    # them would add latency to every keystroke for no benefit.
    proxy_http_version 1.1;
    proxy_set_header Upgrade    $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    # The server reads the client IP from here for its anonymous rate limits;
    # it needs TRUST_PROXY=1 set to believe it.
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;

    # An idle editor still holds its socket. The default 60s read timeout would
    # cut it, and every reconnect is a resync.
    proxy_read_timeout  3600s;
    proxy_send_timeout  3600s;

    # ─── Yjs documents ─────────────────────────────────────────────────────────
    # Matched before the general Socket.IO rule, and distinguished by the query
    # parameter rather than the path — Socket.IO puts every namespace on the same
    # `/socket.io/` endpoint, so the path cannot tell them apart.
    location /socket.io/ {
        if ($arg_doc) {
            proxy_pass http://dobby_documents;
            break;
        }
        proxy_pass http://dobby_sockets;
    }

    # ─── Everything else ───────────────────────────────────────────────────────
    location / {
        proxy_pass http://dobby_api;
        proxy_set_header Connection "";
    }

    # `/metrics` is per replica: each one reports its own rooms, sockets, and
    # documents, and Prometheus sums them. Balancing it would return one node's
    # numbers at random and make every graph nonsense — so scrape the replicas
    # directly and do not expose it here at all.
    location /metrics {
        return 404;
    }
}
