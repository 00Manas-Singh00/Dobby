# deploy/docker-compose.cluster.yml
#
# Two replicas, one Redis, one Postgres, one nginx. This is the smallest
# deployment that can actually be wrong in the ways Phase 4 is about — one
# replica cannot misroute a document, cannot split a room, and cannot double a
# rate limit — so it is the configuration the cluster tests and the load test
# both run against.
#
# As of Phase 5 the replicas share a *database* rather than a file, which is
# what makes them separable: put them on different hosts, point both at the same
# Postgres and Redis, and nothing here changes but the addresses.
#
#   docker compose -f deploy/docker-compose.cluster.yml up --build
#   curl localhost:8080/health
#
# It is a reference, not a production manifest: no TLS, no secrets management,
# and the JWT secret is inline.

services:
  redis:
    image: redis:7-alpine
    # Documents live here in cluster mode, so this is not a cache and must not
    # be configured as one — no maxmemory eviction policy that can drop keys.
    command: redis-server --appendonly yes --maxmemory-policy noeviction
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 2s
      timeout: 2s
      retries: 15
    volumes:
      - redis-data:/data

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: dobby
      POSTGRES_PASSWORD: dobby
      POSTGRES_DB: dobby
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U dobby']
      interval: 2s
      timeout: 2s
      retries: 15
    volumes:
      - postgres-data:/var/lib/postgresql/data

  dobby-1: &dobby
    build:
      context: ..
      dockerfile: deploy/Dockerfile.server
    environment: &dobby-env
      NODE_ID: dobby-1
      PORT: '5001'
      REDIS_URL: redis://redis:6379
      JWT_SECRET: replace-me-with-32-plus-characters-of-entropy
      # The replicas share one database rather than one file. Both create their
      # tables at startup; an advisory lock makes exactly one of them do it.
      DATABASE_URL: postgres://dobby:dobby@postgres:5432/dobby
      # Empty, deliberately: with REDIS_URL set, documents are stored in Redis
      # and a LevelDB directory would be a second, per-node copy of the truth.
      YJS_PERSISTENCE_DIR: ''
      ALLOWED_ORIGINS: http://localhost:8080
      TRUST_PROXY: '1'
      METRICS_TOKEN: replace-me-too
      ENABLE_TERMINAL: 'false'
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy

  dobby-2:
    <<: *dobby
    environment:
      <<: *dobby-env
      NODE_ID: dobby-2

  nginx:
    image: nginx:1.27-alpine
    ports:
      - '8080:80'
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - dobby-1
      - dobby-2

volumes:
  redis-data:
  postgres-data:
